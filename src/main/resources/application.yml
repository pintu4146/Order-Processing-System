spring:
  application:
    name: order-processing-system
  profiles:
    active: dev
  jackson:
    serialization:
      write_dates_as_timestamps: false

# Flyway defaults (can be overridden per profile)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  scheduler:
    interval: 300000 # 5 minutes default
