spring:
  datasource:
    url: jdbc:h2:mem:orderdb_dev;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false

logging:
  level:
    com.orderprocessing: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
