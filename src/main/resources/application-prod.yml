spring:
  datasource:
    url: jdbc:h2:mem:orderdb_prod;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    clean-disabled: true

logging:
  level:
    com.orderprocessing: WARN
    org.flywaydb: WARN
